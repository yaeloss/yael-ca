name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen/images
          key: hugo-images-${{ runner.os }}-0.166.0-${{ hashFiles('layouts/partials/responsive-image.html', 'content/**', 'static/images/uploads/**') }}
          restore-keys: |
            hugo-images-${{ runner.os }}-0.166.0-

      - name: Build
        run: hugo --minify

      - name: Generate legacy WordPress redirects
        run: python3 scripts/generate_redirects.py public

      - name: Verify SEO output
        run: python3 scripts/check_seo.py public

      - name: Verify performance output
        run: python3 scripts/check_performance.py public

      - name: Verify media organization
        run: python3 scripts/check_media_archives.py public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
