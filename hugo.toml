baseURL = "https://yael.ca/"
languageCode = "en-us"
title = "Yaël Ossowski"
theme = "hugo-blog-awesome"
googleAnalytics = "G-44MPTZ5W07"
copyright = "© Yaël Ossowski. All rights reserved."
enableRobotsTXT = true

# Process CMS uploads without changing their existing public URLs.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static/images/uploads"
  target = "assets/images/uploads"

[[cascade]]
  [cascade.target]
    kind = "{taxonomy,term}"
  [cascade.sitemap]
    disable = true

[author]
  name = "Yaël Ossowski"
  email = ""

[params]
  description = "Consumer advocate, policy analyst, and writer covering technology, privacy, energy, legal reform, and lifestyle freedom."
  goToTop = true
  favicon = "favicon.ico"
  rssTitle = "Yaël Ossowski RSS Feed"
  rssDescription = "Latest writing and media appearances from Yaël Ossowski."
  rssFeedDescription = "summary"
  ogimage = "images/og-home.jpg"
  sitename = "Yaël Ossowski"
  socialCardAlt = "Editorial social card for Yaël Ossowski with a portrait photo and site branding."
  x = "@YaelOss"

[outputs]
  home = ["HTML", "RSS", "JSON", "Redirects"]

[outputFormats.Redirects]
  mediaType = "application/json"
  baseName = "legacy-redirects"
  isPlainText = true
  notAlternative = true

[services]
  [services.rss]
    limit = 50

[params.author]
  name = "Yaël Ossowski"
  intro = "Bonjour, I'm Yaël Ossowski."
  avatar = "images/avatar.jpg"
  sameAs = [
    "https://linkedin.com/in/yaeloss",
    "https://x.com/YaelOss",
    "https://yaeloss.substack.com/",
    "https://consumerchoicecenter.org/team/yael-ossowski/",
    "https://www.btcpolicy.org/authors/yael-ossowski"
  ]

[markup.goldmark.renderer]
  unsafe = true

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menus.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

[[menus.main]]
  name = "Categories"
  url = "/categories/"
  weight = 3

[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 4

[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/yaeloss"

[[params.socialIcons]]
  name = "nostr"
  url = "https://primal.net/yael"

[[params.socialIcons]]
  name = "x"
  url = "https://x.com/YaelOss"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/yaeloss"

[[params.socialIcons]]
  name = "rss"
  url = "https://yael.ca/index.xml"
  
