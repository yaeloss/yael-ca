backend:
  name: github
  repo: yaeloss/yael-ca
  branch: main
  base_url: https://auth.yael.live
  auth_endpoint: auth
media_folder: static/images/uploads
public_folder: images/uploads
collections:
  - name: "Yael.ca"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false
        default: []
        hint: 'Use "interviews" for TV, radio, podcast, or YouTube interviews; "talks-panels" for presentations, panels, and testimony. Choose Video under Formats instead of adding a video category.'
        field:
          label: "Category"
          name: "category"
          widget: "string"
      - label: "Formats"
        name: "formats"
        widget: "select"
        multiple: true
        required: false
        options:
          - {label: "Video", value: "video"}
        hint: "Select Video when the post includes or links to a video recording. Leave empty for audio-only interviews and written articles."
      - {label: "Featured Image", name: "featured_image", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "richtext"}
